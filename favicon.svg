<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
    <defs>
        <linearGradient id="indigograd" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#6366f1" />
            <stop offset="100%" stop-color="#4338ca" />
        </linearGradient>
    </defs>
    <!-- Fondo redondeado con degradado índigo -->
    <rect width="64" height="64" rx="16" fill="url(#indigoGrad)" />
    <!-- Tipografía "Aa" representativa de texto y redacción -->
    <text x="32" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="40" font-weight="800" text-anchor="middle" letter-spacing="-1" fill="#ffffff">Aa</text>
    <!-- Detalle sutil de cursor/indicador en la esquina superior -->
    <circle cx="50" cy="14" r="4" fill="#a5b4fc" />
</svg>